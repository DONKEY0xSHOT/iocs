[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iocs"
version = "0.1.0"
description = "Provenance-aware collector for public malware indicators of compromise."
requires-python = ">=3.13"
license = "Unlicense"
dependencies = ["httpx>=0.27"]

[project.scripts]
iocs = "iocs.cli:main"

[project.urls]
Homepage = "https://github.com/DONKEY0xSHOT/iocs"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6", "mypy>=1.11", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["iocs*"]

[tool.setuptools.package-data]
iocs = ["registry.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: excluded from the default run"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["tests/fixtures", ".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RET", "ARG", "S", "PL",
    "D", "C90", "ERA", "RUF", "T20",
]
# D202 and D213 are deliberate house style, the rest conflict with each other
ignore = [
    "S101", "PLR0913", "PLR0917", "D107",
    "D202", "D203", "D213", "D401", "D406", "D407", "D413",
]

[tool.ruff.lint.per-file-ignores]
"iocs/parsers.py" = ["ARG001"]
"tests/**" = ["S", "PLR2004", "ARG", "D"]
"tools/**" = ["S", "PLR2004", "T20", "D"]
"iocs/cli.py" = ["T20"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["iocs", "strategies"]
no-lines-before = ["standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = [".", "tests"]
warn_unreachable = true
disallow_any_explicit = false
files = ["iocs", "tools", "tests"]
exclude = ['tests/fixtures', '\.venv']

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
